{% extends "base.html" %}
{% block title %}Brain — The Sharp Team{% endblock %}
{% block content %}
<style>
.brain-wrap{max-width:640px;margin:0 auto;color:#fff;display:flex;flex-direction:column;min-height:60vh}
.brain-head{text-align:center;padding:14px 0 6px}
.brain-ico{font-size:44px;filter:drop-shadow(0 0 14px rgba(212,175,55,.45))}
.brain-head h2{font-size:26px;font-weight:800;margin:8px 0 4px}
.brain-head .kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:#8f8fb0}
.brain-head .muted{color:#9a9ab5;font-size:13px;margin:6px 0 0;line-height:1.5}
#brainMsgs{display:flex;flex-direction:column;gap:10px;padding:14px 2px;overflow-y:auto;flex:1}
.bmsg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-wrap:break-word}
.bmsg.user{align-self:flex-end;background:#2b6fd6;color:#fff;border-bottom-right-radius:4px}
.bmsg.bot{align-self:flex-start;background:#17171f;border:1px solid #26262f;color:#e8e8f2;border-bottom-left-radius:4px}
.bmsg.bot a{color:#d4af37}
.bcard{background:#0f0f16;border:1px solid #3a3a4a;border-radius:10px;padding:9px 12px;margin-top:8px}
.bcard .t{font-weight:800;font-size:13px}
.bcard .s{font-size:12px;color:#9a9ab5;margin-top:2px}
.bcard .b{font-size:12px;font-weight:800;color:#d4af37;margin-top:4px}
.bchips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 2px 10px}
.bchip{background:#1c1c28;border:1px solid #3a3a4a;color:#e8e8f2;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
.bchip:active{transform:scale(.96)}
.brain-input{display:flex;gap:8px;padding:10px 0 18px;position:sticky;bottom:0;background:inherit}
#brainQ{flex:1;background:#0f0f16;border:1px solid #3a3a4a;color:#fff;border-radius:12px;padding:13px 14px;font-size:15px;box-sizing:border-box}
#brainQ:focus{outline:none;border-color:#d4af37}
#brainSend{background:#d4af37;color:#17171f;font-weight:800;font-size:15px;border:none;border-radius:12px;padding:13px 20px;cursor:pointer}
#brainSend:disabled{opacity:.4;cursor:default}
#brainSend:active:not(:disabled){transform:scale(.96)}
.btyping{color:#9a9ab5;font-size:13px;font-style:italic}
</style>

<div class="brain-wrap">
  <div class="brain-head">
    <div class="kicker">PLATINUM TOOL</div>
    <div class="brain-ico">🧠</div>
    <h2>Brain</h2>
    <p class="muted">Ask about today's edges, parlays, official plays, our record or your bankroll — answered from real program data.</p>
  </div>

  <div class="bchips" id="brainChips">
    <button class="bchip" type="button">Best plays</button>
    <button class="bchip" type="button">Build me a parlay</button>
    <button class="bchip" type="button">Today's plays</button>
    <button class="bchip" type="button">Our record</button>
  </div>

  <div id="brainMsgs"></div>

  <div class="brain-input">
    <input id="brainQ" type="text" placeholder="Ask Brain…" autocomplete="off" maxlength="500" aria-label="Ask Brain">
    <button id="brainSend" type="button">Send</button>
  </div>
</div>

<script>
(function(){
  var msgs = document.getElementById('brainMsgs');
  var input = document.getElementById('brainQ');
  var send = document.getElementById('brainSend');

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function addMsg(text, who){
    var d = document.createElement('div');
    d.className = 'bmsg ' + who;
    d.innerHTML = esc(text).replace(/\n/g, '<br>');
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function addCards(cards){
    (cards || []).forEach(function(c){
      var d = document.createElement('div');
      d.className = 'bcard';
      d.innerHTML = '<div class="t">' + esc(c.title || '') + '</div>'
        + (c.sub ? '<div class="s">' + esc(c.sub) + '</div>' : '')
        + (c.badge ? '<div class="b">' + esc(c.badge) + '</div>' : '');
      var last = msgs.querySelector('.bmsg.bot:last-of-type');
      if (last) last.appendChild(d);
    });
    msgs.scrollTop = msgs.scrollHeight;
  }

  function ask(q){
    q = (q || '').trim();
    if (!q) return;
    addMsg(q, 'user');
    input.value = '';
    send.disabled = true;
    var t = document.createElement('div');
    t.className = 'bmsg bot btyping';
    t.textContent = 'Thinking…';
    msgs.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;
    fetch('/api/ai-ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    }).then(function(r){ return r.json(); })
    .then(function(data){
      t.remove();
      if (data && data.error === 'platinum_required') {
        addMsg('Brain is a Platinum tool. Unlock Platinum to keep chatting.', 'bot');
      } else {
        addMsg((data && data.answer) || 'Sorry, something went wrong. Try again.', 'bot');
        addCards(data && data.cards);
      }
      send.disabled = false;
      input.focus();
    }).catch(function(){
      t.remove();
      addMsg('Connection error. Try again.', 'bot');
      send.disabled = false;
    });
  }

  send.addEventListener('click', function(){ ask(input.value); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') ask(input.value);
  });
  document.getElementById('brainChips').addEventListener('click', function(e){
    if (e.target && e.target.classList.contains('bchip')) ask(e.target.textContent);
  });

  addMsg('Hey — I\'m Brain. Ask me for the best plays, a parlay, today\'s official card, our record, or your bankroll.', 'bot');
})();
</script>
{% endblock %}
