{% extends "base.html" %}
{% block title %}Brain — The Sharp Team{% endblock %}
{% block content %}
<style>
.brain-wrap{max-width:640px;margin:0 auto;color:#fff;display:flex;flex-direction:column}
/* header */
.brain-head{text-align:center;padding:16px 8px 4px}
.brain-ico{font-size:46px;filter:drop-shadow(0 0 14px rgba(212,175,55,.45))}
.brain-head h2{font-size:28px;font-weight:800;margin:8px 0 2px}
.brain-head .kicker{font-size:11px;font-weight:800;letter-spacing:2px;color:#8f8fb0}
.brain-head .sub1{font-size:16px;font-weight:700;color:#e8e8f2;margin:10px 0 2px}
.brain-head .sub2{font-size:13px;color:#9a9ab5;margin:0 0 4px}
/* league tabs */
.brain-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.brain-tabs::-webkit-scrollbar{display:none}
.btab{flex:none;background:#17171f;border:1px solid #3a3a4a;color:#9a9ab5;border-radius:999px;padding:9px 18px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.btab.active{background:rgba(43,111,214,.18);border-color:#2b6fd6;color:#fff}
.btab:active{transform:scale(.95)}
/* suggestion cards grid */
.brain-sugg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 2px 6px}
.bcard-btn{background:#17171f;border:1px solid #3a3a4a;color:#fff;border-radius:14px;padding:16px 12px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;line-height:1.35;min-height:86px;display:flex;align-items:center}
.bcard-btn:active{transform:scale(.97);border-color:#d4af37}
.bcard-btn .em{font-size:20px;margin-right:8px}
/* chat history */
#brainMsgs{display:flex;flex-direction:column;gap:10px;padding:12px 2px;overflow-y:auto}
.bmsg{max-width:88%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-wrap:break-word}
.bmsg.user{align-self:flex-end;background:#2b6fd6;color:#fff;border-bottom-right-radius:4px}
.bmsg.bot{align-self:flex-start;background:#17171f;border:1px solid #3a3a4a;color:#e8e8f2;border-bottom-left-radius:4px}
.bcard{background:#0f0f16;border:1px solid #d4af37;border-radius:10px;padding:9px 12px;margin-top:8px}
.bcard .t{font-weight:800;font-size:13px}
.bcard .s{font-size:12px;color:#9a9ab5;margin-top:2px}
.bcard .b{font-size:12px;font-weight:800;color:#d4af37;margin-top:4px}
/* input */
.brain-input{display:flex;gap:8px;padding:10px 0 18px;position:sticky;bottom:0;background:inherit}
#brainQ{flex:1;background:#0f0f16;border:1px solid #3a3a4a;color:#fff;border-radius:999px;padding:14px 18px;font-size:15px;box-sizing:border-box}
#brainQ:focus{outline:none;border-color:#d4af37}
#brainSend{background:#d4af37;color:#17171f;font-weight:800;font-size:15px;border:none;border-radius:999px;padding:14px 22px;cursor:pointer}
#brainSend:disabled{opacity:.4;cursor:default}
#brainSend:active:not(:disabled){transform:scale(.96)}
.btyping{color:#9a9ab5;font-size:13px;font-style:italic}
</style>

<div class="brain-wrap">
  <div class="brain-head">
    <div class="kicker">PLATINUM TOOL</div>
    <div class="brain-ico">🧠</div>
    <h2>Brain</h2>
    <p class="sub1">How can I assist you today?</p>
    <p class="sub2">Tap a suggestion below or write your own query</p>
  </div>

  <div class="brain-tabs" id="brainTabs" role="tablist" aria-label="Leagues">
    <button class="btab active" type="button" data-league="">All</button>
    <button class="btab" type="button" data-league="NFL">NFL</button>
    <button class="btab" type="button" data-league="NCAAF">NCAAF</button>
    <button class="btab" type="button" data-league="MLB">MLB</button>
    <button class="btab" type="button" data-league="NHL">NHL</button>
    <button class="btab" type="button" data-league="NBA">NBA</button>
  </div>

  <div class="brain-sugg" id="brainSugg"></div>

  <div id="brainMsgs" aria-live="polite"></div>

  <div class="brain-input">
    <input id="brainQ" type="text" placeholder="Ask me for odds, picks, parlays…" autocomplete="off" maxlength="500" aria-label="Ask Brain">
    <button id="brainSend" type="button">Send</button>
  </div>
</div>

<script>
(function(){
  var msgs = document.getElementById('brainMsgs');
  var input = document.getElementById('brainQ');
  var send = document.getElementById('brainSend');
  var sugg = document.getElementById('brainSugg');
  var tabs = document.getElementById('brainTabs');
  var league = '';

  var SUGGESTIONS = [
    {em:'⚡', label:'best', text:function(l){ return l ? 'Show me the best ' + l + ' bets' : 'Show me the best bets'; }},
    {em:'🎫', label:'parlay', text:function(l){ return l ? 'Build me an ' + l + ' parlay' : 'Build me a parlay'; }},
    {em:'📋', label:'plays', text:function(){ return "Show me today's official plays"; }},
    {em:'⚖️', label:'price', text:function(){ return 'Is Detroit Red Wings -166 worth it?'; }},
    {em:'🧾', label:'mybets', text:function(){ return 'Review my bets'; }},
    {em:'📊', label:'record', text:function(){ return "What's our record?"; }}
  ];

  function renderSugg(){
    sugg.innerHTML = '';
    SUGGESTIONS.forEach(function(s){
      var b = document.createElement('button');
      b.className = 'bcard-btn';
      b.type = 'button';
      b.innerHTML = '<span class="em">' + s.em + '</span><span>' + s.text(league) + '</span>';
      b.addEventListener('click', function(){ ask(s.text(league)); });
      sugg.appendChild(b);
    });
  }

  tabs.addEventListener('click', function(e){
    var t = e.target.closest('.btab');
    if (!t) return;
    tabs.querySelectorAll('.btab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    league = t.getAttribute('data-league') || '';
    renderSugg();
  });

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function addMsg(text, who){
    var d = document.createElement('div');
    d.className = 'bmsg ' + who;
    d.innerHTML = esc(text).replace(/\n/g, '<br>');
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function addCards(cards){
    (cards || []).forEach(function(c){
      var d = document.createElement('div');
      d.className = 'bcard';
      d.innerHTML = '<div class="t">' + esc(c.title || '') + '</div>'
        + (c.sub ? '<div class="s">' + esc(c.sub) + '</div>' : '')
        + (c.badge ? '<div class="b">' + esc(c.badge) + '</div>' : '');
      var bots = msgs.querySelectorAll('.bmsg.bot');
      var last = bots[bots.length - 1];
      if (last) last.appendChild(d);
    });
    msgs.scrollTop = msgs.scrollHeight;
  }

  function ask(q){
    q = (q || '').trim();
    if (!q) return;
    addMsg(q, 'user');
    input.value = '';
    send.disabled = true;
    var t = document.createElement('div');
    t.className = 'bmsg bot btyping';
    t.textContent = 'Thinking…';
    msgs.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;
    fetch('/api/ai-ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    }).then(function(r){ return r.json(); })
    .then(function(data){
      t.remove();
      if (data && data.error === 'platinum_required') {
        addMsg('Brain is a Platinum tool. Unlock Platinum to keep chatting.', 'bot');
      } else {
        addMsg((data && data.answer) || 'Sorry, something went wrong. Try again.', 'bot');
        addCards(data && data.cards);
      }
      send.disabled = false;
      input.focus();
    }).catch(function(){
      t.remove();
      addMsg('Connection error. Try again.', 'bot');
      send.disabled = false;
    });
  }

  send.addEventListener('click', function(){ ask(input.value); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter') ask(input.value);
  });

  renderSugg();
})();
</script>
{% endblock %}
