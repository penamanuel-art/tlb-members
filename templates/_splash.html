<!-- SPLASH DE ENTRADA (pedido por Alex 2026-09-27): pre-pantalla con logo,
     mensaje de motivación de la Masterclass del día y nombre de la empresa.
     Sale CADA VEZ que se entra al Dashboard; tap o auto (3.5s) para entrar. -->
<div id="tst-splash" style="position:fixed;inset:0;width:100vw;height:100dvh;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 30%, #1c2536 0%, #0b0f19 60%, #060810 100%);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;cursor:pointer;opacity:1;transition:opacity .6s ease;padding:24px;box-sizing:border-box;">
  <div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);"></div>
  <img src="{{ url_for('static', filename='img/sharp-team-logo.png') }}" alt="The Sharp Team" style="width:170px;height:170px;object-fit:contain;margin-bottom:28px;filter:drop-shadow(0 0 28px rgba(251,191,36,.3));" onerror="this.style.display='none'">
  <div style="color:#fbbf24;font-size:19px;font-weight:800;letter-spacing:8px;margin-bottom:22px;">THE SHARP TEAM</div>
  {% if leccion and leccion.clave %}
  <div style="color:#8b95a9;font-size:15px;font-weight:700;letter-spacing:4px;margin-bottom:18px;">MASTERCLASS · DAY {{ leccion.dia or '' }}{% if leccion.titulo %} · {{ leccion.titulo|upper }}{% endif %}</div>
  <div style="color:#ffffff;font-size:36px;font-weight:800;line-height:1.45;margin:0 0 40px;max-width:560px;">&ldquo;{{ leccion.clave }}&rdquo;</div>
  {% else %}
  <div style="color:#ffffff;font-size:44px;font-weight:800;line-height:1.3;letter-spacing:1px;margin:0 0 20px;max-width:560px;">DISCIPLINE<br>BEATS LUCK.</div>
  <div style="color:#8b95a9;font-size:19px;line-height:1.7;margin:0 0 40px;max-width:480px;">We don't chase. We don't guess.<br>We follow the numbers.</div>
  {% endif %}
  <div id="tst-splash-enter" style="color:#fbbf24;font-size:16px;font-weight:800;letter-spacing:5px;animation:tstPulse 1.6s ease-in-out infinite;">TAP TO ENTER</div>
  <style>@keyframes tstPulse{0%,100%{opacity:.45}50%{opacity:1}}</style>
</div>
<script>
(function(){
  var splash = document.getElementById('tst-splash');
  if (!splash) return;
  function dismiss(){
    if (!splash || splash.dataset.done) return;
    splash.dataset.done = '1';
    splash.style.opacity = '0';
    setTimeout(function(){ if (splash.parentNode) splash.parentNode.removeChild(splash); }, 650);
  }
  splash.addEventListener('click', dismiss);
  setTimeout(dismiss, 5000);
})();
</script>
