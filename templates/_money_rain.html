<!-- MONEY RAIN + celebración (Alex 2026-10-10): solo cuando el día quedó en PROFIT POSITIVO.
     ~5s de billetes cayendo + popup grande descartable con el monto exacto, en inglés. -->
<canvas id="lluvia-dinero" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
<div id="moneyrain-popup" style="position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:16px;">
  <div style="pointer-events:auto;background:#0b0e14;border:2px solid #c9a227;border-radius:20px;padding:26px 32px;text-align:center;max-width:88vw;box-shadow:0 20px 60px rgba(0,0,0,.65);animation:mrpop .45s ease-out;">
    <div style="font-size:54px;line-height:1;">💸</div>
    <div style="color:#c9a227;font-weight:900;font-size:26px;letter-spacing:1px;margin-top:8px;font-family:system-ui,-apple-system,sans-serif;">MONEY RAIN!</div>
    <div style="color:#22c55e;font-weight:900;font-size:34px;margin-top:8px;font-family:system-ui,-apple-system,sans-serif;">{{ lluvia_monto }} yesterday!</div>
    <div style="color:#ffffff;font-size:15px;margin-top:10px;opacity:.92;font-family:system-ui,-apple-system,sans-serif;">We finished yesterday in profit.<br>Discipline pays. 🦈</div>
    <button onclick="document.getElementById('moneyrain-popup').remove()" style="margin-top:18px;background:#22c55e;color:#0b0e14;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:11px 30px;cursor:pointer;font-family:system-ui,-apple-system,sans-serif;">Let's go! &rarr;</button>
  </div>
</div>
<style>@keyframes mrpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}</style>
<script>
(function(){
  var canvas = document.getElementById('lluvia-dinero');
  var popup = document.getElementById('moneyrain-popup');
  function quitar(){ if (canvas) canvas.remove(); if (popup) popup.remove(); }
  // Once per session: if it already rained on entry, don't repeat when navigating the menu
  try {
    if (sessionStorage.getItem('lb_lluvia') === '1') { quitar(); return; }
    sessionStorage.setItem('lb_lluvia', '1');
  } catch (e) {}
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { quitar(); return; }
  // Sonido "cha-ching" estilo Cash App (Alex 2026-10-10): sintetizado con Web Audio API,
  // sin archivos externos. Doble tono metálico (E6 -> A6). Si el navegador bloquea el
  // autoplay (iOS), se reintenta al primer toque del usuario; si sigue bloqueado, no pasa nada.
  function tono(ac, freq, t0, dur){
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.45, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function chaching(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!window.__mrAC) window.__mrAC = new AC();
      var ac = window.__mrAC;
      function play(){
        var t = ac.currentTime + 0.02;
        tono(ac, 1318.5, t, 0.12);        // E6 — el "cha"
        tono(ac, 1760.0, t + 0.11, 0.40); // A6 — el "ching"
      }
      if (ac.state === 'suspended') {
        var retry = function(){
          try { ac.resume(); play(); } catch (e) {}
          window.removeEventListener('touchstart', retry);
          window.removeEventListener('pointerdown', retry);
        };
        window.addEventListener('touchstart', retry);
        window.addEventListener('pointerdown', retry);
        try { ac.resume(); } catch (e) {}
      }
      play();
    } catch (e) {}
  }
  chaching();
  var ctx = canvas.getContext('2d');
  var W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function size(){ W = innerWidth; H = innerHeight; canvas.width = W*DPR; canvas.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  size(); addEventListener('resize', size);
  // Money rain INTENSA (Alex 2026-10-10: "que llueva MUCHO dinero, como la de
  // Wise Guys"): lluvia fuerte, no ligera — muchos más billetes cayendo.
  var POOL = ['\uD83D\uDCB0','\uD83D\uDCB0','\uD83D\uDCB0','\uD83D\uDCB0','\uD83D\uDCB0',
              '\uD83D\uDCB5','\uD83D\uDCB5','\uD83D\uDCB5',
              '$','$','$','$','$'];
  var N = Math.max(160, Math.min(320, Math.floor(W/3))), chips = [], i;
  for (i = 0; i < N; i++) { var e = POOL[Math.floor(Math.random()*POOL.length)];
    chips.push({
      x: Math.random()*W, y: -50 - Math.random()*H*0.6,
      vy: 4.5 + Math.random()*4.5,
      sway: Math.random()*6.28, swaySpd: 0.02 + Math.random()*0.03,
      rot: (Math.random()-0.5)*0.9, rotSpd: (Math.random()-0.5)*0.06,
      e: e, size: e === '$' ? 26 + Math.random()*14 : 36 + Math.random()*24, alpha: 1
    });
  }
  // El MONTO cae con la lluvia (Alex 2026-10-10): el número va cayendo junto
  // con los billetes, no solo en el popup.
  var MONTO_TXT = {{ lluvia_monto|tojson }};
  for (var k = 0; k < 10; k++) {
    chips.push({
      x: Math.random()*W, y: -50 - Math.random()*H*0.4,
      vy: 4.0 + Math.random()*3.0,
      sway: Math.random()*6.28, swaySpd: 0.02 + Math.random()*0.03,
      rot: (Math.random()-0.5)*0.3, rotSpd: (Math.random()-0.5)*0.03,
      e: 'monto', size: 30 + Math.random()*14, alpha: 1
    });
  }
  function draw(c){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = c.alpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (c.e === 'monto') {
      ctx.font = '900 ' + Math.round(c.size) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#22c55e';
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4;
      ctx.strokeText(MONTO_TXT, 0, 0); ctx.fillText(MONTO_TXT, 0, 0);
    } else if (c.e === '$') {
      ctx.font = 'bold ' + Math.round(c.size) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#fbbf24';
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3;
      ctx.strokeText('$', 0, 0); ctx.fillText('$', 0, 0);
    } else {
      ctx.font = Math.round(c.size) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
      ctx.fillText(c.e, 0, 0);
    }
    ctx.restore();
  }
  var t0 = performance.now(), DUR = 7000;
  function frame(t){
    var el = t - t0, p = el / DUR;
    ctx.clearRect(0, 0, W, H);
    for (i = 0; i < chips.length; i++){ var c = chips[i];
      c.y += c.vy; c.sway += c.swaySpd; c.x += Math.sin(c.sway)*1.2; c.rot += c.rotSpd;
      if (p > 0.82) c.alpha = Math.max(0, 1 - (p - 0.82)/0.18);
      if (c.y < H + 60) draw(c);
    }
    if (el < DUR + 300) requestAnimationFrame(frame); else canvas.remove();
  }
  requestAnimationFrame(frame);
  // El popup se descarta solo a los 8s (además del botón "Let's go!")
  setTimeout(function(){ if (popup) popup.remove(); }, 8000);
})();
</script>
