{% extends "base.html" %}
{% block title %}Create account — The Sharp Team{% endblock %}
{% block content %}
<section class="auth-card">
  <h2>Create your <span class="accent">free</span> account</h2>
  <p class="muted">No card, no payments. Just your tracker.</p>
  <form method="post" action="{{ url_for('register') }}">
    <label>Name
      <input type="text" name="nombre" required autocomplete="name" placeholder="Your name">
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="email" placeholder="you@email.com">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters">
    </label>
    <label>Phone <span class="muted" style="font-weight:400">(optional, for SMS alerts)</span>
      <input type="tel" name="phone" autocomplete="tel" placeholder="+1 (555) 123-4567">
    </label>
    <label class="sms-optin">
      <input type="checkbox" name="sms_optin" value="1">
      <span>Yes, text me my daily plays and membership updates from The Sharp Team at the number above. Msg &amp; data rates may apply. Reply STOP to cancel, HELP for help.</span>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Create my account →</button>
  </form>
  <a href="{{ url_for('free_landing') }}" class="free-plays-promo">⭐ SEE WHAT'S INCLUDED — GOLD →</a>
  <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></p>
</section>
<style>
.free-plays-promo{display:block;text-align:center;margin:22px 0 6px;padding:20px 16px;border-radius:16px;
  background:linear-gradient(135deg,rgba(245,197,66,.16),rgba(245,197,66,.06));
  border:2px solid #f5c542;color:#f5c542;font-weight:900;font-size:21px;letter-spacing:.3px;text-decoration:none;
  box-shadow:0 0 22px rgba(245,197,66,.25)}
.free-plays-promo:active{transform:scale(.98)}
.sms-optin{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:13px;line-height:1.5;color:var(--muted,#9aa3b8);cursor:pointer}
.sms-optin input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:#22c55e;cursor:pointer}
.sms-optin span{flex:1}
</style>
{% endblock %}
