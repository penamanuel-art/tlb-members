{% extends "base.html" %}
{% block title %}Log in — The Line Breaker{% endblock %}
{% block content %}
<section class="auth-card">
  <h2>Log in to <span class="accent">my tracker</span></h2>
  <form method="post" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <label>Email
      <input type="email" name="email" required autocomplete="email" placeholder="you@email.com">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password" placeholder="Your password">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Log in →</button>
  </form>
  <p class="muted center">No account? <a href="{{ url_for('register') }}">Create one free</a></p>
</section>
{% endblock %}
