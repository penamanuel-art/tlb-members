{% extends "base.html" %}
{% block title %}Entrar — The Line Breaker{% endblock %}
{% block content %}
<section class="auth-card">
  <h2>Entrar a <span class="accent">mi tracker</span></h2>
  <form method="post" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
    <label>Email
      <input type="email" name="email" required autocomplete="email" placeholder="tu@email.com">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
    </label>
    <button class="btn btn-primary btn-block" type="submit">Entrar →</button>
  </form>
  <p class="muted center">¿Sin cuenta? <a href="{{ url_for('register') }}">Créala gratis</a></p>
</section>
{% endblock %}
