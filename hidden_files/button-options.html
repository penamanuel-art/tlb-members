<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#06060c;color:#fff;font-family:-apple-system,sans-serif;padding:20px;margin:0}
.opt{margin-bottom:28px;padding:16px;background:rgba(255,255,255,0.03);border-radius:16px}
.opt h3{font-size:13px;color:#60a5fa;margin:0 0 12px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* Style 1: Minimal */
.s1{background:transparent;border:1px solid rgba(255,255,255,0.15);color:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
/* Style 2: Glass */
.s2{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;border-radius:14px;padding:9px 16px;font-size:13px;font-weight:600;backdrop-filter:blur(10px)}
/* Style 3: Blue accent */
.s3{background:rgba(96,165,250,0.15);border:1px solid rgba(96,165,250,0.3);color:#93c5fd;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:600}
/* Style 4: Pill subtle */
.s4{background:rgba(255,255,255,0.05);border:none;color:#e5e7eb;border-radius:999px;padding:8px 18px;font-size:13px;font-weight:500}
</style></head><body>
<div class="opt"><h3>1. Minimal</h3><div class="row"><button class="s1">📜 Full record</button><button class="s1">🎓 Academy</button></div></div>
<div class="opt"><h3>2. Glass</h3><div class="row"><button class="s2">📜 Full record</button><button class="s2">🎓 Academy</button></div></div>
<div class="opt"><h3>3. Blue accent</h3><div class="row"><button class="s3">📜 Full record</button><button class="s3">🎓 Academy</button></div></div>
<div class="opt"><h3>4. Pill sutil</h3><div class="row"><button class="s4">📜 Full record</button><button class="s4">🎓 Academy</button></div></div>
</body></html>
